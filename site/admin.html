<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关系观察手册 · 密码管理</title>
<style>
:root{--ink:#443a50;--muted:#81788a;--purple:#7957a8;--pale:#f4effa;--line:#e8e0ef;--card:#fff;--bg:#faf8fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0%,#fff 0,transparent 40%),var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}.wrap{width:min(100% - 28px,1050px);margin:auto;padding:28px 0 56px}.brand{text-align:center;color:var(--purple);letter-spacing:.18em;font-size:12px;margin-bottom:22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 35px #40304b0b;margin-bottom:18px}h1,h2{font-weight:550;line-height:1.4}h1{font-size:26px;margin:0 0 8px}h2{font-size:19px;margin:0 0 16px}.muted{color:var(--muted);font-size:13px}.form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;outline:0}input:focus{border-color:#b9a3d0}.btn{border:0;border-radius:10px;padding:11px 17px;background:var(--purple);color:#fff;font:inherit;cursor:pointer}.btn:disabled{opacity:.5}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.error{min-height:22px;color:#a05060;font-size:13px;margin-top:8px}.output{margin-top:16px;padding:15px;background:#faf7fd;border:1px solid var(--line);border-radius:12px}.codes{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.8 ui-monospace,monospace;resize:vertical}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:690px;font-size:13px}th,td{text-align:left;border-bottom:1px solid #eee9f2;padding:10px 9px;white-space:nowrap}th{color:var(--muted);font-weight:500}.status{display:inline-block;border-radius:20px;padding:2px 9px;background:#eef7ef;color:#547b5d}.status.exhausted{background:#f3f0f5;color:#857b8d}.status.disabled{background:#fff0ef;color:#a15e59}.login{width:min(100%,440px);margin:10vh auto}.login input{margin:12px 0}.login .btn{width:100%}.hidden{display:none!important}.note{font-size:12px;color:var(--muted);margin:8px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}.form .field:first-child{grid-column:1/-1}.form button{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}.wrap{padding-top:16px}}
</style><script src="./config.js"></script></head><body><main class="wrap"><div class="brand">关系观察手册 · 管理端</div>
<section id="login" class="panel login"><h1>密码管理后台</h1><p class="muted">登录后可生成、导出和停用测试密码。</p><form id="loginForm"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="管理员密码" required><button class="btn">登录后台</button><div id="loginError" class="error" role="status"></div></form></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="top"><div><h1>访问密码管理</h1><p class="muted">密码仅在生成时展示一次，之后数据库只保留校验摘要。建议立即下载并妥善保管 CSV。</p></div><button id="logout" class="btn secondary">退出登录</button></div></div>
<div class="panel"><h2>生成一批随机密码</h2><form id="batchForm" class="form"><div class="field"><label for="label">批次备注</label><input id="label" maxlength="80" placeholder="例如：10 月活动用户"></div><div class="field"><label for="count">生成数量（1–500）</label><input id="count" type="number" min="1" max="500" value="20" required></div><div class="field"><label for="maxUses">每个密码可用次数</label><input id="maxUses" type="number" min="1" max="20" value="3" required></div><button class="btn">生成并导出</button></form><div id="batchError" class="error"></div><div id="newBatch" class="output hidden"><strong id="batchTitle">密码已生成</strong><p class="note">请现在下载 CSV；离开本页后无法再次查看完整密码。</p><textarea id="newCodes" class="codes" readonly></textarea><div class="actions"><button id="downloadCsv" class="btn">下载 CSV（Excel 可打开）</button><button id="copyCodes" class="btn secondary">复制密码</button></div></div></div>
<div class="panel"><div class="top"><div><h2>已生成的密码</h2><p class="muted">仅显示使用状态，无法从后台找回已导出的原始密码。</p></div><button id="refresh" class="btn secondary">刷新列表</button></div><div id="listError" class="error"></div><div class="table-wrap"><table><thead><tr><th>批次</th><th>创建时间</th><th>已用 / 总次数</th><th>剩余</th><th>状态</th><th>操作</th></tr></thead><tbody id="codeRows"></tbody></table></div></div></section></main>
<script>
const $=s=>document.querySelector(s);let latestCodes=[];let adminToken=sessionStorage.getItem('quiz-admin-token')||'';const cloudConfig=window.RELATIONSHIP_QUIZ_CONFIG||{};const cloudReady=Boolean(cloudConfig.supabaseUrl&&cloudConfig.publishableKey&&!cloudConfig.supabaseUrl.includes('YOUR_PROJECT_REF')&&!cloudConfig.publishableKey.includes('YOUR_SUPABASE'));async function api(url,body){let requestBody=body;let method=body?'POST':'GET';let target=url;if(cloudReady){if(url.startsWith('/api/access?code=')){requestBody={code:new URL(url,location.origin).searchParams.get('code')};url='/api/access';method='POST'}const headers=requestBody?{'Content-Type':'application/json'}:{};headers.apikey=cloudConfig.publishableKey;if(adminToken)headers['x-admin-token']=adminToken;target=cloudConfig.supabaseUrl.replace(/\/$/,'')+'/functions/v1/quiz-api'+url;const r=await fetch(target,{method,headers,body:requestBody?JSON.stringify(requestBody):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}const r=await fetch(target,{method,headers:requestBody?{'Content-Type':'application/json'}:{},body:requestBody?JSON.stringify(requestBody):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}function showDash(){ $('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');loadCodes()}async function boot(){try{const d=await api('/api/admin/session');if(d.authenticated)showDash()}catch{}}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const data=await api('/api/admin/login',{password:$('#adminPassword').value});if(data.token){adminToken=data.token;sessionStorage.setItem('quiz-admin-token',adminToken)}$('#adminPassword').value='';showDash()}catch(err){$('#loginError').textContent=err.message}};$('#logout').onclick=async()=>{try{await api('/api/admin/logout',{})}finally{adminToken='';sessionStorage.removeItem('quiz-admin-token');$('#dashboard').classList.add('hidden');$('#login').classList.remove('hidden')}};
$('#batchForm').onsubmit=async e=>{e.preventDefault();$('#batchError').textContent='';const submit=$('#batchForm button');submit.disabled=true;try{const d=await api('/api/admin/batches',{label:$('#label').value,count:Number($('#count').value),max_uses:Number($('#maxUses').value)});latestCodes=d.codes;$('#batchTitle').textContent=`${d.label} · ${d.codes.length} 个密码`;$('#newCodes').value=d.codes.map(x=>x.password).join('\n');$('#newBatch').classList.remove('hidden');await loadCodes()}catch(err){$('#batchError').textContent=err.message}finally{submit.disabled=false}};function downloadCsv(){if(!latestCodes.length)return;const rows=[['password','max_uses'],...latestCodes.map(c=>[c.password,c.max_uses])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='relationship-access-codes.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}$('#downloadCsv').onclick=downloadCsv;$('#copyCodes').onclick=async()=>{try{await navigator.clipboard.writeText($('#newCodes').value);$('#copyCodes').textContent='已复制'}catch{$('#newCodes').select();document.execCommand('copy')}};function date(t){return new Date(t*1000).toLocaleString('zh-CN',{hour12:false})}async function loadCodes(){try{const d=await api('/api/admin/codes');$('#listError').textContent='';const body=$('#codeRows');body.replaceChildren();d.codes.forEach(c=>{const tr=document.createElement('tr');const values=[c.batch,date(c.created_at),`${c.used_count} / ${c.max_uses}`,c.remaining];values.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const status=document.createElement('td'),badge=document.createElement('span');badge.className='status '+c.status;badge.textContent={active:'可用',exhausted:'已用完',disabled:'已停用'}[c.status];status.appendChild(badge);tr.appendChild(status);const action=document.createElement('td');if(c.status==='active'){const b=document.createElement('button');b.className='btn secondary';b.textContent='停用';b.onclick=async()=>{if(!confirm('停用后该密码将无法继续使用，确定吗？'))return;try{await api(`/api/admin/codes/${encodeURIComponent(c.id)}/disable`,{});loadCodes()}catch(err){$('#listError').textContent=err.message}};action.appendChild(b)}else action.textContent='—';tr.appendChild(action);body.appendChild(tr)})}catch(err){$('#listError').textContent=err.message}}$('#refresh').onclick=loadCodes;boot();
</script></body></html>
